name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-ci:
    uses: kurkle/configs/.github/workflows/shared-ci.yml@v1
    with:
      fetch-depth: 1
      run-audit-signatures: false
      run-typecheck: false
      run-build: false
      browser-tests: false
      run-sonar: true
      coverage-paths: coverage/lcov.info
      extra-command: npm run pack:check
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
